name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checks out the exact commit the release tag points to (detached
      # HEAD) — we build and publish precisely what was tagged, not
      # whatever main happens to be at workflow-run time. Uses the default
      # GITHUB_TOKEN (contents: write above is enough for the push-back
      # step below); no push-triggered workflow exists here to loop into.
      - uses: actions/checkout@v6

      # Fails fast with a clear message instead of running the whole build
      # only to hit a cryptic ENEEDAUTH/404 from `npm publish` at the very end.
      #
      # NPM_TOKEN must be a Granular Access Token (npmjs.com > Access Tokens >
      # Generate New Token > Granular Access Token) with:
      #   - Packages and scopes: @authyon/browser and @authyon/server (or "All packages")
      #   - Permissions: Read and write
      #   - "Bypass 2FA" checked — without this, npm requires an interactive
      #     OTP on publish, which a CI runner can never provide, and surfaces
      #     as a confusing 404 rather than an auth error.
      - name: Verify NPM_TOKEN is configured
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set (or is empty)."
            echo "::error::Create a Granular Access Token (Read and write, Bypass 2FA) and add it as NPM_TOKEN under Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Written by hand instead of via setup-node's `registry-url` input —
      # that generates an .npmrc with the deprecated `always-auth` key,
      # which recent npm warns will be removed in its next major version.
      - name: Configure npm registry auth
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      # The release's tag IS the version — e.g. tag "v1.2.3" (or "1.2.3")
      # sets @authyon/browser and @authyon/server to 1.2.3 in lockstep.
      - name: Set package versions from the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm version "$VERSION" --workspaces --no-git-tag-version --allow-same-version

      - name: Publish packages
        run: npm publish --workspaces --access public

      # Reflects the published version back in package.json. Pushed as a
      # plain (non-force) fast-forward onto main — if main moved since the
      # tag was cut, this fails loudly instead of overwriting anything.
      - name: Commit version bump back to main
        run: |
          git config user.name "github-actions"
          git config user.email "ci@github.com"
          git add packages/*/package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Versions already match — nothing to commit."
          else
            git commit -m "chore(release): publish v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi
